<div class="display_sort_by">
<p class="margin_gap_sort_by"><strong>{{ 'sort.title' | translate }}</strong></p>
<p class="margin_gap" (click)="highToLow()" [ngClass]="{'isActive': isActiveHigh === 1}">{{ 'sort.highToLow' | translate }}</p>
<p class="margin_gap" (click)="lowToHigh()" [ngClass]="{'isActive': isActive === 1}">{{ 'sort.lowToHigh' | translate }}</p>
<p class="margin_gap" (click)="sortbyDiscount()" [ngClass]="{'isActive': isActiveDiscount === 1}">{{ 'sort.discount' | translate }}</p>
</div>
