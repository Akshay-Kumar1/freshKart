<section class="padding_filter">
  <fieldset class="category-filter" *ngIf="categories.length">
    <legend>{{ 'filter.categoriesTitle' | translate }}</legend>
    <label class="category-option" *ngFor="let category of categories">
      <input type="checkbox" [checked]="selectedCategories.includes(category)"
        (change)="toggleCategory(category, $event)">
      <span>{{ ('filter.categories.' + category) | translate }}</span>
    </label>
  </fieldset>
  <div class="filter-actions">
    <button class="filter_button" type="button" (click)="filterItems()">
      {{ 'filter.apply' | translate }}
    </button>
    <button class="reset_filter_button" type="button" (click)="resetFilters()">
      {{ 'filter.reset' | translate }}
    </button>
  </div>
</section>
